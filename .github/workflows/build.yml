name: Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    # 只有 手动触发运行 或 commit message 中不包含 [skip ci] 才会运行
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
      
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      
      - name: Set up Signing Key
        run: |
          # 只有在 Github Secrets 中配置了 KEYSTORE_BASE64 才配置
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # 请将 keystore 以 base64 的形式储存在 Github Secrets 中
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore
            echo "storeFile=../keystore" > signing.properties
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing.properties
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing.properties
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> signing.properties
          fi
          
      - name: Build with Gradle
        id: build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          
          echo "APK=$(find ./app/build/outputs/apk/release -name "*.apk")" >> $GITHUB_OUTPUT
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.APK }}
          archive: false
