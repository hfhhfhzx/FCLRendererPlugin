name: Build and Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'
      
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      
      - name: Set up Signing Key
        run: |
          # 只有在 Github Secrets 中配置了 KEYSTORE_BASE64 才配置
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # 请将 keystore 以 base64 的形式储存在 Github Secrets 中
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore
            echo "storeFile=../keystore" > signing.properties
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> signing.properties
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> signing.properties
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> signing.properties
          fi
          
      - name: Build with Gradle
        id: build
        run: |
          chmod +x ./gradlew
          start_time="$(date +%s)"
          ./gradlew assembleRelease
          end_time="$(date +%s)"

          duration_seconds=$((end_time - start_time))
          duration_minutes=$((duration_seconds / 60))
          duration_remainder=$((duration_seconds % 60))
          printf -v duration_human "%dm %02ds" "$duration_minutes" "$duration_remainder"
          
          echo "APK=$(find ./app/build/outputs/apk/release -name "*.apk")" >> $GITHUB_OUTPUT
          echo "build_duration=$duration_human" >> $GITHUB_OUTPUT
      
      - name: Get Version
        run: |
          echo "Version=$(git describe --tags --match v* --abbrev=0)" >> $GITHUB_ENV
          echo "VersionCode=$(git rev-list --count HEAD)" >> $GITHUB_ENV
      
      - name: Prepare Release
        id: prepare_release
        run: |
          {
            echo
            echo "---"
            echo
            echo "- **Version:** \`${{ env.Version }}\`"
            echo "- **VersionCode:** \`${{ env.VersionCode }}\`"
            echo "- **Build time:** \`${{ steps.build.outputs.build_duration }}\`"
          } > custom-header.md
          echo "isPre=$(echo "${{ env.Version }}" | grep -qiE "alpha|beta|snapshot|pre|rc" && echo true || echo false)" >> $GITHUB_ENV
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.Version }}
          tag_name: ${{ env.Version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.APK }}
          prerelease: ${{ env.isPre }}
          
      - name: Update Release with Custom Header
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTO_BODY=$(gh release view ${{ env.Version }} --json body -q '.body')
          
          {
            echo "$AUTO_BODY"
            cat custom-header.md
          } > full-release-note.md
          
          gh release edit ${{ env.Version }} -F full-release-note.md
